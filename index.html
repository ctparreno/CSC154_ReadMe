<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ReadMe</title>

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <header class="site-header">
        <div class="site-brand">ReadMe</div>
    </header>

    <main class="page-shell">
        <section class="hero">

            <h1>Find something to read.</h1>

            <form class="search-form">
                <input type="text" id="searchInput" name="query" placeholder="Search by title, author, or subject..."
                    aria-label="Search for books" />

                <button type="submit">
                    Search
                </button>
            </form>

            <p class="subtitle">
                Search freely available books and read them directly in your browser.
            </p>

            <section id="results" class="results-grid" aria-live="polite"></section>

        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
